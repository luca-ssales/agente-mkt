<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detecção de Termos Negativos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }

        .negativo {
            background: #fee2e2;
            color: #991b1b;
        }

        .positivo {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚨 Detecção de Palavras Negativas</h1>

        <p>
            Verifica se a mensagem contém termos críticos
            para priorizar o atendimento.
        </p>

        <form method="POST">

            <label for="mensagem">
                <strong>Mensagem do cliente:</strong>
            </label>

            <textarea
                id="mensagem"
                name="mensagem"
                placeholder="Digite a mensagem do cliente..."
            >{{ mensagem }}</textarea>

            <button type="submit">
                Verificar Mensagem
            </button>

        </form>

        {% if resultado %}
            <div class="resultado {{ resultado.tipo }}">
                {{ resultado.mensagem }}
            </div>
        {% endif %}

    </div>

</body>
</html>
